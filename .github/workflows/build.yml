name: Build paket siap jual

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang LibreOffice, Poppler, dan font metrik Office
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-impress poppler-utils libcairo2 \
            fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation

      - name: Pasang dependensi Python
        run: pip install -r requirements.txt

      - name: Bangun semua paket
        run: python build.py

      - name: Unggah ZIP siap jual
        uses: actions/upload-artifact@v4
        with:
          name: zip-siap-jual
          path: dist/*/*.zip

      - name: Unggah bahan marketing (mockup, pratinjau, deskripsi)
        uses: actions/upload-artifact@v4
        with:
          name: bahan-marketing
          path: dist/*/marketing/

      - name: Rilis (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/*.zip
            dist/*/marketing/Pratinjau-*.pdf
